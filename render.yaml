# FREE PLAN hosting on Render (render.com -> New -> Blueprint -> pick this repo).
# Beginner steps: docs/put-dashboard-online.md
# Two free web services: the API and the dashboard. Free services sleep after
# 15 minutes without visits; the first visit after that takes about a minute.
# FASTER: give dualflow-web the keys marked "one server mode" below and the API runs
# inside the dashboard server; then dualflow-api can be suspended (docs/faster-dashboard.md).
# Values marked "sync: false" are asked for once in Render's screen. Never put keys in this file.
services:
  - type: web
    name: dualflow-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @dualflow/db run deploy
    startCommand: pnpm --filter @dualflow/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: STORAGE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: dualflow
      # "Run now" button (optional): a fine-grained GitHub token with Actions read/write on this repo only.
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      - key: GEMINI_DAILY_REQUESTS
        value: "20"

  - type: web
    name: dualflow-web
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @dualflow/web build
    # Starts the dashboard, plus the API inside it when DATABASE_URL is set (one server mode).
    startCommand: sh scripts/start-dashboard.sh
    envVars:
      - key: NODE_VERSION
        value: "22"
      # ---- One server mode (faster): copy these values from dualflow-api -> Environment. ----
      - key: DATABASE_URL
        sync: false
      - key: STORAGE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: dualflow
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      - key: GEMINI_DAILY_REQUESTS
        value: "20"
      # ---- end of one server mode ----
      - key: API_URL
        sync: false # the dualflow-api address, e.g. https://dualflow-api.onrender.com (check it after the first deploy)
      - key: INTERNAL_API_KEY
        fromService: { type: web, name: dualflow-api, envVarKey: INTERNAL_API_KEY }
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Name shown on the public /privacy page (Google, Meta and TikTok read it).
      - key: NEXT_PUBLIC_OWNER_NAME
        value: Namaste Facts

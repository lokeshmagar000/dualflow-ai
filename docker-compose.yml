# Local development database. Run: docker compose up -d
# (The free plan needs no Redis: the job queue lives in Postgres.)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dualflow
      POSTGRES_PASSWORD: dualflow
      POSTGRES_DB: dualflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:

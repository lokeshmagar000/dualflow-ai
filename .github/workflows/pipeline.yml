# FREE PLAN: this is the "worker". It makes the videos, then the machine stops.
#
# It starts:
#   - by itself every night at 2:00 AM and 4:00 AM Nepal time (schedule). Each run adds
#     one AUTOMATIC story = one Nepali video + one English video (your unused ideas
#     first, otherwise the AI picks a topic), up to AUTO_STORIES_PER_DAY a day (default 2).
#     Finished videos wait on the dashboard's "Ready to upload" page for you to download.
#     GitHub sometimes skips a scheduled run when it is busy, so there are two backup
#     runs (3:00 AM and 5:00 AM). They only add a story when today still has fewer than
#     AUTO_STORIES_PER_DAY, so you never get extra videos.
#     A catch-up run at 2:15 PM Nepal (just after the free Gemini limit resets) finishes
#     videos that had to wait for the limit. It adds no new story.
#   - when you press "Run now" / "Generate now" in the dashboard (or "Run workflow" in the Actions tab).
#
# Your keys are stored in GitHub: Settings -> Secrets and variables -> Actions.
# They are never written in the code. See README "Free plan setup".
name: Pipeline
# The name shown in the run list (the Mac app shows it too).
run-name: ${{ inputs.topic && format('Idea - {0}', inputs.topic) || inputs.auto_now && 'Generate now (automatic topic)' || format('Pipeline ({0})', github.event_name) }}
on:
  # GitHub's clock is UTC. Nepal is UTC + 5:45, so:
  #   2:00 AM Nepal = 20:15 UTC (the evening before)
  #   4:00 AM Nepal = 22:15 UTC (the evening before)
  # GitHub sometimes starts scheduled runs 5-30 minutes late when it is busy.
  # To change the times: edit these lines (minute hour * * *, in UTC).
  # Keep apps/api/src/routes/auto.ts (SCHEDULE_UTC) the same when you change these.
  schedule:
    - cron: "15 20 * * *" # 2:00 AM Nepal
    - cron: "15 21 * * *" # 3:00 AM Nepal (backup, in case GitHub skipped the 2 AM run)
    - cron: "15 22 * * *" # 4:00 AM Nepal
    - cron: "15 23 * * *" # 5:00 AM Nepal (backup, in case GitHub skipped the 4 AM run)
    - cron: "30 8 * * *" # 2:15 PM Nepal: catch-up (finishes waiting videos, adds no new story)
  workflow_dispatch:
    inputs:
      topic:
        description: "Your own idea (optional). Makes one story about it in Nepali + English."
        type: string
        default: ""
      auto_now:
        description: "Make one automatic video now (the AI picks the topic), even if today already has enough"
        type: boolean
        default: false
      demo_story:
        description: "Add a practice story first (Mount Everest, Nepali + English)"
        type: boolean
        default: false
      remake_latest:
        description: "Remake the newest video (same script and voice, no Gemini needed)"
        type: boolean
        default: false
  # No "push" test runs any more: each one made a practice story that used up the free
  # Gemini requests meant for your night videos (and then blocked them). To test a branch,
  # use "Run workflow" on that branch with "Add a practice story" ticked.

# Only one run at a time; a new request waits for the current run to finish.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # AI (free: gemini). Switch to claude later by changing the AI_PROVIDER variable.
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_DAILY_REQUESTS: ${{ vars.GEMINI_DAILY_REQUESTS || '20' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Voice (free: azure F0 or edge)
      # Gemini voices (same free key as the AI). When today's free voices run out, Edge is the backup.
      VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER || 'gemini' }}
      VOICE_FALLBACK: ${{ vars.VOICE_FALLBACK || 'edge' }}
      GEMINI_VOICE_NE: ${{ vars.GEMINI_VOICE_NE }}
      GEMINI_VOICE_EN: ${{ vars.GEMINI_VOICE_EN }}
      GEMINI_TTS_DAILY_REQUESTS: ${{ vars.GEMINI_TTS_DAILY_REQUESTS || '14' }}
      # Video maker: free stock clips for the backgrounds (Pixabay first, then Pexels;
      # without a key: colour backgrounds).
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'DualFlow' }}
      # Look of the video: Word Pop subtitles and a 2-second intro with sound (README "Video look").
      SUBTITLE_STYLE: ${{ vars.SUBTITLE_STYLE || 'word-pop' }}
      INTRO_SECONDS: ${{ vars.INTRO_SECONDS || '2' }}
      INTRO_SOUND: ${{ vars.INTRO_SOUND || 'on' }}
      INTRO_TEXT_NE: ${{ vars.INTRO_TEXT_NE }}
      INTRO_TEXT_EN: ${{ vars.INTRO_TEXT_EN }}
      INTRO_TAGLINE_NE: ${{ vars.INTRO_TAGLINE_NE }}
      INTRO_TAGLINE_EN: ${{ vars.INTRO_TAGLINE_EN }}
      # Brand: "Namaste Facts" / "नमस्ते फ्याक्ट्स" in the videos and thumbnails (defaults in packages/shared/src/brand.ts).
      BRAND_NAME_NE: ${{ vars.BRAND_NAME_NE }}
      BRAND_NAME_EN: ${{ vars.BRAND_NAME_EN }}
      BRAND_TAGLINE_NE: ${{ vars.BRAND_TAGLINE_NE }}
      BRAND_TAGLINE_EN: ${{ vars.BRAND_TAGLINE_EN }}
      BRAND_HASHTAGS_NE: ${{ vars.BRAND_HASHTAGS_NE }}
      BRAND_HASHTAGS_EN: ${{ vars.BRAND_HASHTAGS_EN }}
      HASHTAG_SEARCH: ${{ vars.HASHTAG_SEARCH || 'on' }}
      RENDER_CONCURRENCY: 2
      EDGE_VOICE_NE: ${{ vars.EDGE_VOICE_NE }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
      AZURE_VOICE_NE: ${{ vars.AZURE_VOICE_NE }}
      # Files (free: Cloudflare R2)
      STORAGE: r2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # Optional: the key that unlocks channels connected on the dashboard (default: R2_SECRET_ACCESS_KEY).
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'dualflow' }}
      # Automatic videos (README "Automatic videos"). 0 turns them off.
      AUTO_STORIES_PER_DAY: ${{ vars.AUTO_STORIES_PER_DAY || '2' }}
      AUTO_TOPIC_NICHE: ${{ vars.AUTO_TOPIC_NICHE }}
      AUTO_TIMEZONE: ${{ vars.AUTO_TIMEZONE || 'Asia/Kathmandu' }}
      # How long finished videos stay in storage (cleanup step).
      KEEP_DAYS_AFTER_UPLOAD: ${{ vars.KEEP_DAYS_AFTER_UPLOAD || '7' }}
      READY_KEEP_DAYS: ${{ vars.READY_KEEP_DAYS || '30' }}
      WORKER_CONCURRENCY: "2"
      WORKER_MAX_MINUTES: "40"
      # Uploads to social channels (see docs/social-setup.md). Off until PUBLISH_ENABLED=true.
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || 'false' }}
      PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN || 'true' }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'approval' }}
      PUBLISH_MODE_YOUTUBE: ${{ vars.PUBLISH_MODE_YOUTUBE }}
      PUBLISH_MODE_FACEBOOK: ${{ vars.PUBLISH_MODE_FACEBOOK }}
      PUBLISH_MODE_INSTAGRAM: ${{ vars.PUBLISH_MODE_INSTAGRAM }}
      PUBLISH_MODE_TIKTOK: ${{ vars.PUBLISH_MODE_TIKTOK }}
      PUBLISH_PLATFORMS: ${{ vars.PUBLISH_PLATFORMS }}
      PUBLISH_TIMES: ${{ vars.PUBLISH_TIMES }}
      PUBLISH_TIMEZONE: ${{ vars.PUBLISH_TIMEZONE }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'private' }}
      YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID }}
      TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN_NE: ${{ secrets.YOUTUBE_REFRESH_TOKEN_NE }}
      YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
      FACEBOOK_PAGE_ID_NE: ${{ secrets.FACEBOOK_PAGE_ID_NE }}
      FACEBOOK_PAGE_ID_EN: ${{ secrets.FACEBOOK_PAGE_ID_EN }}
      FACEBOOK_PAGE_TOKEN_NE: ${{ secrets.FACEBOOK_PAGE_TOKEN_NE }}
      FACEBOOK_PAGE_TOKEN_EN: ${{ secrets.FACEBOOK_PAGE_TOKEN_EN }}
      INSTAGRAM_USER_ID_NE: ${{ secrets.INSTAGRAM_USER_ID_NE }}
      INSTAGRAM_USER_ID_EN: ${{ secrets.INSTAGRAM_USER_ID_EN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN_NE: ${{ secrets.TIKTOK_REFRESH_TOKEN_NE }}
      TIKTOK_REFRESH_TOKEN_EN: ${{ secrets.TIKTOK_REFRESH_TOKEN_EN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # FFmpeg turns the voice MP3 into raw audio. A ready-made copy downloads in seconds
      # (installing it with apt took about 8 minutes).
      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pip install -r packages/voice/python/requirements.txt
          ffmpeg -version >/dev/null && ffmpeg -version | head -n 1
      - name: Check settings
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL secret (see README, Free plan setup)"; exit 1; fi
      - name: Update the database tables
        run: pnpm db:generate && pnpm --filter @dualflow/db run deploy
      # Your own idea (from the Mac app or "Run workflow"), or the practice story.
      - name: Add your idea or a practice story
        if: inputs.topic || inputs.demo_story
        run: pnpm --filter @dualflow/worker demo-story
        env:
          DEMO_TOPIC: ${{ inputs.topic }}
      # Automatic videos: add today's next story (does nothing if today already has enough).
      - name: Pick the next topic automatically
        if: "!inputs.remake_latest && github.event.schedule != '30 8 * * *'"
        run: pnpm --filter @dualflow/worker auto-ideas
        env:
          # "Generate now" button: make one even if Auto mode is off or today already has enough.
          AUTO_FORCE: ${{ inputs.auto_now && 'true' || 'false' }}
          # Which video of the day this scheduled run is for: the 2 AM run (and its 3 AM backup)
          # makes video 1, the 4 AM run (and its 5 AM backup) makes video 2.
          AUTO_SLOT: ${{ (github.event.schedule == '15 20 * * *' || github.event.schedule == '15 21 * * *') && '1' || (github.event.schedule == '15 22 * * *' || github.event.schedule == '15 23 * * *') && '2' || '' }}
      - name: Remake the newest video
        if: inputs.remake_latest
        run: pnpm --filter @dualflow/worker remake-video
      - name: Make the videos
        run: pnpm --filter @dualflow/worker once
        env:
          VIDEO_COPY_DIR: ${{ github.workspace }}/videos
      # Upload finished videos whose time has come (does nothing until Auto upload is on: dashboard, Channels page).
      # A problem here never stops the cleanup or the video download below.
      - name: Upload to social channels
        if: always()
        run: pnpm --filter @dualflow/worker upload
      # Download the finished videos from the bottom of the run page ("videos").
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: videos/
          if-no-files-found: ignore
          retention-days: 7
      - name: Delete old files (keeps storage under 10 GB)
        if: always()
        # A short Cloudflare hiccup here must not turn a good video run red.
        continue-on-error: true
        run: pnpm --filter @dualflow/worker cleanup

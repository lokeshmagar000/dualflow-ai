# Runs on every pull request: install, type-check, test and build.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    # A real Postgres, so the job queue tests can run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dualflow
          POSTGRES_PASSWORD: dualflow
          POSTGRES_DB: dualflow
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dualflow:dualflow@localhost:5432/dualflow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @dualflow/db run deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @dualflow/web build
